<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThiSáng - Ôn Thi Trắc Nghiệm</title>

  <!-- 1. Nạp Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body style="margin: 0; background-color: #0b0f17;">

  <!-- Khai báo thẻ chứa giao diện chính -->
  <div id="app">
    <div style="text-align: center; color: #94a3b8; padding-top: 100px; font-family: sans-serif;">
      Đang tải...
    </div>
  </div>

  <!-- 2. Nạp file app.js kèm chống cache triệt để -->
<script src="app.js?v=2"></script> 
 <!-- Modal Tùy chỉnh & Tải lên tài liệu tạo đề AI -->
  <div id="aiQuizModal" class="ai-modal-overlay" style="display: none;">
    <div class="ai-modal-content">
      <div class="ai-modal-header">
        <h3 id="modalSubjectTitle">Tạo Đề Trắc Nghiệm Thông Minh</h3>
        <button class="close-modal-btn" onclick="closeAiModal()">&times;</button>
      </div>

      <div class="ai-modal-body">
        <!-- Khu vực tải file/ảnh với nút dấu cộng -->
        <div class="upload-dropzone" onclick="document.getElementById('fileInput').click()">
          <div class="plus-icon-box">+</div>
          <p>Bấm vào đây hoặc kéo thả file tài liệu / ảnh chụp bài học vào đây</p>
          <span class="file-support-text">Hỗ trợ PDF, PNG, JPG (tối đa 3MB)</span>
          <input type="file" id="fileInput" style="display: none;" accept=".pdf,.png,.jpg,.jpeg" onchange="handleFileSelect(event)">
        </div>
        <div id="selectedFileName" class="selected-file-name"></div>

        <!-- Tùy chỉnh số lượng câu hỏi -->
        <div class="quiz-settings-group">
          <label>Số lượng câu trắc nghiệm (4 lựa chọn): <span id="valMcq">10</span> câu</label>
          <input type="range" id="rangeMcq" min="5" max="30" step="5" value="10" oninput="document.getElementById('valMcq').innerText = this.value">
        </div>

        <div class="quiz-settings-group">
          <label>Số lượng câu Đúng / Sai: <span id="valTf">5</span> câu</label>
          <input type="range" id="rangeTf" min="0" max="10" step="1" value="5" oninput="document.getElementById('valTf').innerText = this.value">
        </div>

        <!-- Nút tạo đề -->
        <button class="generate-quiz-btn" onclick="generateAiQuiz()">🚀 Tạo đề bằng AI</button>
        <p class="free-limit-note">Lượt dùng Free: Còn lại <span id="remainingQuota">5</span>/5 lượt trong 5 giờ.</p>
      </div>
    </div>
  </div>
  <script src="quiz.js?v=2"></script>
</body>
</html>
